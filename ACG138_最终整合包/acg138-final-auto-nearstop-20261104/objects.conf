# 本模块只处理实物感知，不输出导航或电机命令。
# 默认支持检测与跟踪，双目测距使用实测标定参数。
stereo_enabled=1
reference_eye=0
calibration_file=calibration/objects-calibration.bin
frame_max_age_ms=1200
depth_max_age_ms=2000
snapshot_jpeg_quality=80
confirm_frames=2
track_lost_ms=3000
track_expire_ms=10000
max_tracks=65
min_depth_m=0.15
max_depth_m=5.0
disparity_count=128
scale=0.25
camera_to_body_verified=0
camera_x_m=0.1265
camera_y_m=0
camera_z_m=0
camera_roll_deg=0
camera_pitch_deg=0
camera_yaw_deg=0
camera_delay_ms=0

# 初始面积仅供诊断，保留旧键名以兼容配置。
# 关联使用各次观测的尺度、原始灰度和运动信息。
# 选中目标保留至取消或epoch重置，过期规则只作用于其他编号。
anchor_area_ratio_min=0.45
anchor_area_ratio_max=2.2
anchor_aspect_tol=0.40
anchor_position_claim_m=0.35
identity_reject_frames=10

# 2026-10-31实测的单目内参与双目几何参数。
mono_eye0_file=calibration/mono-eye0.conf
mono_eye1_file=calibration/mono-eye1.conf
stereo_extrinsics_file=calibration/stereo-extrinsics.json

# 限制快照发布频率；没有新检测帧时保留原图时间并继续计算年龄。
snapshot_period_ms=250

# 仅用于实物大小分类，不作为避障或停车距离。
size_box_small_m=0.25
size_box_large_m=0.45
size_bottle_small_m=0.18
size_bottle_large_m=0.28
size_cup_small_m=0.10
size_cup_large_m=0.18
