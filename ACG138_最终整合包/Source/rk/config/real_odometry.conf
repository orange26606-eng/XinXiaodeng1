# 左右轮距暂按290mm配置，设置calibrated=1前需实测核对。
# 推定轮位：M1左前、M2右前、M3左后、M4右后。
# 代码分组为左侧M1/M3、右侧M2/M4，已知M1/M2为前轮。
# 编码器方向需实车核对，不能仅依据电机方向判断。
# 初始前方为+X，左侧为+Y，逆时针航向为正。
calibrated=0
left_mask=5
track_mm=290
m1_sign=1
m2_sign=-1
m3_sign=1
m4_sign=-1
m1_mm_per_count=0.1606496243
m2_mm_per_count=0.1606496243
m3_mm_per_count=0.1606496243
m4_mm_per_count=0.1606496243
yaw_sign=1
yaw_offset_deg=0
correction_tau=0.35
